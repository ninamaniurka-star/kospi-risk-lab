name: Update prices and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1-5"   # weekdays after the Korean close (09:17 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/update_prices.py
      - name: Commit new prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kospi_prices.csv
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/kospi_prices.csv _site/data/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
